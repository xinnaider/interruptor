name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão semver (ex: 1.0.1). Ignorado se disparado por tag."
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    # Runner macOS self-hosted (registrar no Mac de dev com label "macOS")
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ Release v$V"

      - name: Build app bundle
        run: |
          chmod +x app/build.sh scripts/release-app.sh
          ./scripts/release-app.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Interruptor v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Interruptor-${{ steps.ver.outputs.version }}.zip
            dist/appcast.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
