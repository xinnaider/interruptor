name: Release macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão semver (ex: 1.0.1). Usado só no dispatch manual."
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "→ Release v$V"

      - name: Sync VERSION file
        run: echo "${{ steps.ver.outputs.version }}" > VERSION

      - name: Build app bundle
        run: |
          chmod +x app/build.sh scripts/release-app.sh
          ./scripts/release-app.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Interruptor v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Interruptor-${{ steps.ver.outputs.version }}.zip
            dist/appcast.json

      - name: Update appcast on site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add landingpage/public/appcast.json VERSION
          git diff --staged --quiet || git commit -m "chore(release): appcast v${{ steps.ver.outputs.version }}"
          git push origin HEAD:main
