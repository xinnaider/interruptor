name: Landing

on:
  push:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - "deploy/**"
      - ".github/workflows/landing.yml"
      - "VERSION"
  pull_request:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install & build
        run: |
          cd landingpage
          npm ci
          npm run build

  publish:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/xinnaider/interruptor-landing
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: landingpage
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy interruptor.jfernando.dev
    runs-on: ubuntu-latest
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            mkdir -p ~/interruptor-landing
            cd ~/interruptor-landing

            # compose de produção (sincronizado do repo)
            curl -fsSL -o docker-compose.yml \
              "https://raw.githubusercontent.com/xinnaider/interruptor/${{ github.ref_name }}/deploy/docker-compose.yml"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            # nginx + cert na primeira vez (idempotente)
            if ! grep -q "interruptor.jfernando.dev" /etc/nginx/sites-available/jfernando.dev 2>/dev/null; then
              curl -fsSL -o /tmp/nginx-interruptor.conf \
                "https://raw.githubusercontent.com/xinnaider/interruptor/${{ github.ref_name }}/deploy/nginx-interruptor.conf"
              cat /tmp/nginx-interruptor.conf >> /etc/nginx/sites-available/jfernando.dev
              nginx -t
              systemctl reload nginx
            fi

            if [ ! -d /etc/letsencrypt/live/interruptor.jfernando.dev ]; then
              certbot certonly --webroot -w /var/www/certbot \
                -d interruptor.jfernando.dev \
                --non-interactive --agree-tos -m "${{ secrets.LETSENCRYPT_EMAIL }}"
              nginx -t && systemctl reload nginx
            fi

            sleep 3
            curl -sf http://127.0.0.1:3002/health && echo "Health OK"
