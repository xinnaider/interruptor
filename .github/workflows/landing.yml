name: Landing

on:
  push:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - "deploy/**"
      - ".github/workflows/landing.yml"
      - "VERSION"
  pull_request:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

jobs:
  check:
    name: Build landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install & build
        run: |
          cd landingpage
          npm ci
          npm run build

  deploy:
    name: Deploy to Dokploy
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
        run: |
          set -euo pipefail
          curl -sfS -X POST "${DOKPLOY_URL}/api/compose.deploy" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"ci ${GITHUB_SHA}\"}"
          echo
          echo "Dokploy deploy queued after CI passed"
