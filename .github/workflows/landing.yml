name: Landing

on:
  push:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - "deploy/**"
      - ".github/workflows/landing.yml"
      - "VERSION"
  pull_request:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

jobs:
  check:
    name: Build landing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install & build
        run: |
          cd landingpage
          npm ci
          npm run build

  # Deploy: Dokploy auto-deploy (GitHub webhook)
