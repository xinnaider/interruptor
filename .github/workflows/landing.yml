name: Landing

on:
  push:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - "deploy/**"
      - ".github/workflows/landing.yml"
      - "VERSION"
  pull_request:
    branches: [main, master]
    paths:
      - "landingpage/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

jobs:
  check:
    name: Build landing
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landingpage/package-lock.json

      - name: Install & build
        run: |
          cd landingpage
          npm ci
          npm run build

  deploy:
    name: Build & deploy interruptor.jfernando.dev
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    steps:
      - name: Sync repo & restart stack
        run: |
          set -e
          REPO=/home/gha-runner/interruptor
          STACK=/home/gha-runner/interruptor-landing

          if [ ! -d "$REPO/.git" ]; then
            git clone https://github.com/xinnaider/interruptor.git "$REPO"
          fi

          cd "$REPO"
          git fetch origin
          git checkout -B main origin/main

          echo "--- Build image (local) ---"
          docker build -t ghcr.io/xinnaider/interruptor-landing:latest ./landingpage

          mkdir -p "$STACK"
          cp deploy/docker-compose.yml "$STACK/docker-compose.yml"

          echo "--- Restart containers ---"
          cd "$STACK"
          docker compose up -d --force-recreate --remove-orphans

          echo "--- Prune stale images ---"
          docker image prune -f

          echo "--- Health check ---"
          sleep 3
          curl -sf http://127.0.0.1:3002/health && echo "Health OK"
