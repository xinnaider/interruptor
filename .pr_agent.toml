[config]
# OpenAI-compatible via 9router (LiteLLM openai/ prefix)
model = "openai/clinepass/cline-pass/kimi-k2.7-code"
fallback_models = ["openai/clinepass/cline-pass/kimi-k2.7-code"]
custom_model_max_tokens = 128000

[pr_reviewer]
extra_instructions = """
- Responda em português (Brasil) quando fizer sentido.
- Priorize bugs, segurança, regressões e edge cases.
- Evite nitpicks de estilo se o lint/format já cobre.
"""

[pr_code_suggestions]
num_code_suggestions = 4
