# Snippet para /etc/nginx/sites-available/jfernando.dev
# Porta local: 3002 (ver deploy/docker-compose.yml)

server {
    listen 80;
    server_name interruptor.jfernando.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name interruptor.jfernando.dev;

    ssl_certificate     /etc/letsencrypt/live/interruptor.jfernando.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/interruptor.jfernando.dev/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    location /_astro/ {
        proxy_pass http://127.0.0.1:3002;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
